version: "3"

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  ###################################################
  ############## Install Dependencies ###############
  ###################################################

  install:
    desc: Install all dependencies for the project
    cmds:
      - task: install:frontend
      - task: install:crates
      - task: build:test

  install:frontend:
    desc: Install dependencies for the frontend packages
    cmds:
      - deno task check:toolchain
      - deno install
      - deno task prepare

  install:crates:
    desc: Install dependencies for all Rust workspace packages
    cmds:
      - cargo fetch

  ###################################################
  ############## Clean and Build Tasks ##############
  ###################################################

  export-contracts:
    desc: Regenerate frontend contracts and the plugin protocol bindings
    cmds:
      - cargo xtask export-contracts
      - deno task --filter @ora/contracts generate:error-schema

  check:contracts:
    desc: Verify all generated contracts without changing the working tree
    cmds:
      - cargo xtask check-contracts
      - deno run -A scripts/check-contract-schema.ts

  check:features:
    desc: Verify named public feature interfaces and shared-state dependencies
    cmds:
      - deno run -A scripts/check-feature-interfaces.ts

  check:rust-size:
    desc: Check production Rust module size and ratcheting legacy exceptions
    cmds:
      - cargo xtask check-rust-size

  build:
    desc: Build all Rust workspace packages
    cmds:
      - cargo build --workspace

  build:test:
    desc: Precompile Rust workspace checks and test targets
    env:
      CARGO_INCREMENTAL: "0"
    cmds:
      - cargo clippy --workspace --exclude ora-desktop --exclude ora-desktop-tests -- -D warnings
      - cargo test --workspace --exclude ora-desktop --exclude ora-desktop-tests --no-run

  build:reaper:
    desc: Build the debug process reaper sidecar for the current target
    cmds:
      - deno run -A scripts/build-reaper.ts

  build:reaper:release:
    desc: Build the release process reaper sidecar for the current target
    cmds:
      - deno run -A scripts/build-reaper.ts --release

  build:desktop:
    desc: >-
      Internal base task for building the Tauri desktop bundle; use
      package:desktop for a complete local installer
    cmds:
      - task: build:reaper:release
      - task: export-contracts
      - deno task --filter @ora/desktop tauri build

  package:desktop:
    desc: >-
      Build a complete local desktop installer the same way desktop-build.yml
      does (sidecars enabled, working-copy edits restored afterward)
    cmds:
      - deno run -A scripts/package-desktop.ts {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts
    cmds:
      - deno task clean:frontend
      - cargo clean

  clean:debug:
    desc: Clean only Rust debug build artifacts
    cmds:
      - cargo clean --profile dev

  format:
    desc: Format files changed in the working tree or staging area
    cmds:
      - deno run -A scripts/format-changed.ts

  format:all:
    desc: Format all frontend and Rust workspace packages
    cmds:
      - task: format:frontend
      - task: format:crates

  format:frontend:
    desc: Format all frontend packages covered by lint
    silent: true
    cmds:
      - deno task --filter @ora/desktop format
      - deno task --filter @ora/chat format
      - deno task --filter @ora/editor format
      - deno task --filter @ora/workflow-runtime format
      - deno task --filter @ora/app-shell format
      - deno task --filter @ora-space/plugin-sdk format

  format:crates:
    desc: Format all Rust workspace packages
    silent: true
    cmds:
      - cargo fmt --all

  lint:
    desc: Run linters for the frontend and Rust workspace packages
    cmds:
      - task: lint:frontend
      - task: lint:crates

  lint:frontend:
    desc: Run linters on all frontend packages
    silent: true
    cmds:
      - deno task check:tooling
      - task: check:features
      - deno task --filter @ora/desktop lint
      - deno task --filter @ora/contracts lint
      - deno task --filter @ora/chat lint
      - deno task --filter @ora/editor lint
      - deno task --filter @ora/workflow-runtime lint
      - deno task --filter @ora/app-shell lint
      - deno task --filter @ora-space/plugin-sdk lint

  lint:crates:
    desc: Run linters on all crates packages
    env:
      CARGO_INCREMENTAL: "0"
    silent: true
    cmds:
      - cargo fmt --all -- --check
      - task: check:rust-size
      - cargo clippy --workspace --exclude ora-desktop --exclude ora-desktop-tests -- -D warnings

  lint:tauri:
    desc: Run linters on the Tauri desktop package
    env:
      CARGO_INCREMENTAL: "0"
    silent: true
    cmds:
      - cargo clippy --package ora-desktop -- -D warnings

  lint:e2e:
    desc: Run linters on the Desktop E2E package
    env:
      CARGO_INCREMENTAL: "0"
    silent: true
    cmds:
      - cargo clippy --package ora-desktop-tests --tests -- -D warnings

  test:
    desc: Run all frontend and Rust workspace checks (may take a long time)
    silent: true
    cmds:
      - task: test:frontend
      - task: test:crates
      - task: test:tauri
      - task: test:e2e

  test:frontend:
    desc: Run all frontend TypeScript package test suites
    cmds:
      - task: check:contracts
      - task: lint:frontend
      - deno task test:tooling
      - deno task --filter @ora/desktop test
      - deno task --filter @ora/contracts test
      - deno task --filter @ora/chat test
      - deno task --filter @ora/editor test
      - deno task --filter @ora/workflow-runtime test
      - deno task --filter @ora/app-shell test
      - deno task --filter @ora-space/plugin-sdk test

  test:crates:
    desc: Run all Rust workspace package test suites
    env:
      CARGO_INCREMENTAL: "0"
    preconditions:
      - sh: command -v rg >/dev/null 2>&1
        msg: "Ripgrep (rg) is not available on PATH. Install it before running Rust tests."
      - sh: command -v deno >/dev/null 2>&1
        msg: "Deno is not available on PATH. Install it before running Rust tests."
    cmds:
      - task: lint:crates
      - cargo test --workspace --exclude ora-desktop --exclude ora-desktop-tests

  test:tauri:
    desc: Run the Tauri desktop package test suite
    env:
      CARGO_INCREMENTAL: "0"
    cmds:
      - task: lint:tauri
      - cargo test --package ora-desktop

  test:e2e:
    desc: Run the Desktop E2E test suite
    env:
      CARGO_INCREMENTAL: "0"
    cmds:
      - task: lint:e2e
      - cargo test --package ora-desktop-tests

  ###################################################
  ############# Run Development Servers #############
  ###################################################

  run:desktop:
    desc: Run the desktop Tauri app in development mode
    preconditions:
      - sh: command -v rg >/dev/null 2>&1
        msg: "Ripgrep (rg) is not available on PATH. Install it before running Desktop."
      - sh: command -v deno >/dev/null 2>&1
        msg: "Deno is not available on PATH. Install it before running Desktop."
    env:
      ORA_DATA_DIR: "{{.ROOT_DIR}}/.data"
      VSLANG: "1033"
    cmds:
      - task: build:reaper
      - cargo xtask reconcile-migrations "{{.ROOT_DIR}}/.data"
      - deno task --filter @ora/desktop tauri dev

  logdy:
    desc: Follow Ora backend's daily logs in the local Logdy UI
    preconditions:
      - sh: command -v logdy >/dev/null 2>&1
        msg: "Logdy is not available on PATH. Provide Logdy before running this task."
      - sh: '{{if eq OS "windows"}}command -v pwsh >/dev/null 2>&1{{else}}true{{end}}'
        msg: "PowerShell 7 is required to follow log files reliably on Windows. Install pwsh and ensure it is available on PATH."
      - sh: ls .data/logs/ora.log.* >/dev/null 2>&1
        msg: "No Ora daily log files found in .data/logs (expected ora.log.YYYY-MM-DD). Start the Desktop app first."
    cmds:
      - |
        {{if eq OS "windows"}}
        # Logdy 0.17.1 can miss NTFS append notifications, so let PowerShell own the file watch.
        pwsh -NoProfile -Command '
          $logs = @(Get-ChildItem -Path ".data/logs/ora.log.*" -File | Sort-Object Name)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Get-Content -LiteralPath $logs[-1].FullName -Encoding UTF8 -Wait | ForEach-Object {
            [Console]::Out.WriteLine($_)
            [Console]::Out.Flush()
          }
        ' | logdy --ui-ip 127.0.0.1 --port {{.PORT | default "8090"}} --no-analytics --no-updates --config logdy.config.json
        {{else}}
        set -- .data/logs/ora.log.*
        logdy follow --full-read "$@" --ui-ip 127.0.0.1 --port {{.PORT | default "8090"}} --no-analytics --no-updates --config logdy.config.json
        {{end}}
