[package]
name = "ora-desktop-tests"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "fake-agent"
path = "fake-agent/main.rs"
test = false
bench = false

[[test]]
name = "desktop"
path = "tests/desktop/main.rs"

[[test]]
name = "plugin-marketplace"
path = "tests/plugin_marketplace.rs"

[lints]
workspace = true

[dev-dependencies]
chrono-tz = { workspace = true }
ora-backend = { workspace = true }
ora-contracts = { workspace = true }
ora-db = { workspace = true }
ora-domain = { workspace = true }
ora-history = { workspace = true }
ora-logging = { workspace = true }
ora-plugin-manifest = { workspace = true }
ora-plugin-manager = { workspace = true }
ora-plugin-registry = { workspace = true }
ora-utils = { workspace = true }
pretty_assertions = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }

[dependencies]
agent-client-protocol-schema = { workspace = true }
ora-plugin-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
