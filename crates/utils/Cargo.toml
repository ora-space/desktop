[package]
name = "ora-utils"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["validation"]
archive = ["dep:zip", "dep:tar", "dep:flate2"]
hash = ["dep:sha2"]
url = []
http = ["dep:url", "dep:sha2", "dep:hmac"]
http-reqwest = [
    "http",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio",
    "tokio/fs",
    "dep:time",
]
# Domain-free MCP client used for bounded health handshakes: newline JSON-RPC over stdio and
# Streamable HTTP. Gated so path-only consumers stay light.
mcp = [
    "dep:reqwest",
    "reqwest?/json",
    "dep:tokio",
    "tokio?/process",
    "tokio?/io-util",
    "dep:url",
]
validation = ["hash", "url", "dep:quick-xml"]
local-ipc = ["dep:tokio", "tokio/net", "tokio/time"]
rust-source = ["dep:proc-macro2", "dep:syn"]

[dependencies]
flate2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true, features = ["span-locations"] }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true, features = ["full", "visit"] }
tar = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
unicode-normalization = { workspace = true }
url = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in every Linux build through tempfile; the fd-relative tree re-own needs its safe
# `O_PATH` and `*at` calls.
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
flate2 = { workspace = true }
futures = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "process"] }
tokio-rustls = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The depth test raises its own soft descriptor limit up to the hard one.
rustix = { workspace = true, features = ["process"] }
