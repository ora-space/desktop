# PR test workflow (Linux only).
#
# Triggers:
# - pull_request (any base branch): runs the test blocks affected by the change set.
# - push to main: runs both blocks unconditionally. This doubles as the
#   post-merge verification and as the only cache producer — PR runs can read
#   caches created on main, but caches written inside a PR are scoped to that
#   PR and invisible to other PRs, so PR runs are restore-only (save-if below).

name: pr-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-tests-${{ github.ref }}
  # Cancel superseded runs on PR pushes only; never cancel main runs, they
  # are the cache producers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      crates: ${{ steps.filter.outputs.crates }}
      tauri: ${{ steps.filter.outputs.tauri }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # On push to main every block runs regardless, so the filter only needs
      # to execute for pull_request events (where it diffs via the API and
      # needs no checkout).
      - name: Detect affected blocks
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            shared: &shared
              - 'Taskfile.yml'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'package.json'
              - 'deno.lock'
              - 'deno.json'
              - '.deno-version'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - *shared
              - 'packages/**'
              - 'crates/contracts/**'
              - 'xtask/**'
              - 'apps/desktop/web/**'
              - 'apps/desktop/src-tauri/bindings.rs'
              - 'apps/desktop/src-tauri/bindings/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/*.json'
              - 'apps/desktop/*.ts'
              - 'apps/desktop/tsconfig*.json'
            crates:
              - *shared
              - 'crates/**'
              - 'xtask/**'
              - 'apps/desktop/src-tauri/bindings.rs'
              - 'apps/desktop/src-tauri/bindings/**'
            tauri:
              - *shared
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
            e2e:
              - *shared
              - 'crates/**'
              - 'e2e/**'

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
          cache: true
      # test:frontend verifies Rust-owned contract generation without modifying the checkout
      # and also runs the Desktop frontend tests.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: deno install --frozen
      - run: task test:frontend

  crates:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      # The root workspace now contains both shared crates and Tauri packages.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # zip's XZ support links Rust test binaries against liblzma.
      - name: Install Rust system dependencies
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev
      # ora-fs search tests spawn ripgrep by command name. Keep the downloaded
      # sidecar outside the repository and expose it through the job PATH.
      - name: Setup ripgrep
        run: |
          deno run -A scripts/setup-binary.ts rg
          mkdir -p "$RUNNER_TEMP/bin"
          mv apps/desktop/src-tauri/binaries/rg-x86_64-unknown-linux-gnu "$RUNNER_TEMP/bin/rg"
          chmod +x "$RUNNER_TEMP/bin/rg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rg" --version
        env:
          RG_VERSION: 15.2.0
      - run: task test:crates

  tauri:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # These libraries are only needed by the Tauri crate.
      - name: Install Tauri system dependencies
        timeout-minutes: 16
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          install_tauri_dependencies() {
            sudo apt-get update
            sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" \
              apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                libxdo-dev \
                libssl-dev \
                build-essential
          }
          export -f install_tauri_dependencies

          for attempt in 1 2 3; do
            echo "::group::Install Tauri system dependencies (attempt ${attempt}/3)"
            if timeout --kill-after=10s 5m \
              bash -euo pipefail -c install_tauri_dependencies; then
              echo "::endgroup::"
              exit 0
            else
              status=$?
            fi
            echo "::endgroup::"

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Tauri system dependency installation failed after 3 attempts (last exit code: ${status})"
              exit "$status"
            fi

            echo "::warning::Tauri system dependency installation failed with exit code ${status}; retrying in 10 seconds"
            sleep 10
          done
      - run: task test:tauri

  e2e:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: task test:e2e

  # Aggregate gate: the single check to mark as "required" in branch
  # protection. Skipped blocks count as success; failures and cancellations
  # propagate. Without this, a required-but-path-skipped job would leave the
  # PR pending forever.
  ci-ok:
    needs: [changes, frontend, crates, tauri, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check aggregated job results
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            frontend=${{ needs.frontend.result }}
            crates=${{ needs.crates.result }}
            tauri=${{ needs.tauri.result }}
            e2e=${{ needs.e2e.result }}
        run: |
          echo "$RESULTS"
          for entry in $RESULTS; do
            result="${entry#*=}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Job ${entry%%=*} finished with result '$result'"
              exit 1
            fi
          done
