# Desktop packaging workflow (three-platform Tauri bundles).
#
# Triggers:
# - workflow_dispatch: builds installers and uploads them as workflow
#   artifacts. Publishing is an explicit opt-in: check `release` and provide
#   `tag` to also create a draft GitHub Release.
# - push of a `v*` tag: equivalent to release=true with the pushed tag.
#
# Bundle targets come from tauri.conf.json (`dmg`, `nsis`, `appimage`, `deb`);
# on each OS the Tauri bundler only produces the targets valid for that
# platform. All three platforms build the same commit in parallel and the
# release job collects every artifact into a single draft Release.
#
# Artifacts are unsigned: macOS Gatekeeper and Windows SmartScreen will warn.
# Code signing and notarization are tracked separately; when certificates are
# available, provide TAURI_SIGNING_PRIVATE_KEY / APPLE_CERTIFICATE /
# WINDOWS_CERTIFICATE secrets and add the corresponding env to the build step.
name: desktop-build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish artifacts as a draft GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag (e.g. v0.1.0); required when release=true"
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older LTS keeps the glibc floor low for AppImage/deb consumers.
          - os: ubuntu-22.04
          # arm64 (Apple Silicon); add macos-13 if Intel builds are needed.
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Installs the toolchain pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Two independent cargo workspaces: the root workspace (compiled by
      # `cargo xtask export-contracts`) and the standalone src-tauri workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      # System libraries required to compile and bundle Tauri 2 on Ubuntu 22.04.
      # Keep in sync with https://v2.tauri.app/start/prerequisites/#linux when
      # upgrading Tauri.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential
      - run: pnpm install --frozen-lockfile
        env:
          DENO_VERSION: v2.9.5
          RG_VERSION: 15.2.0
      - run: task build:desktop
      - uses: actions/upload-artifact@v6
        with:
          name: ora-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: bundle
    if: inputs.release || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Manual dispatch with release=true must name the tag explicitly; tag
      # pushes carry it in the ref.
      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: |
          echo "::error::release=true requires the 'tag' input (e.g. v0.1.0)"
          exit 1
      - uses: actions/download-artifact@v7
        with:
          path: bundles
          merge-multiple: true
      # Draft on purpose: unsigned artifacts get a manual check before publish.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: bundles/**
