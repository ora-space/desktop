# Desktop packaging workflow (three-platform Tauri bundles).
#
# Triggers:
# - workflow_dispatch: builds installers and uploads them as workflow
#   artifacts. Publishing is an explicit opt-in: check `release` and provide
#   `tag` to also create a draft GitHub Release.
# - push of a `v*` tag: equivalent to release=true with the pushed tag.
#
# Bundle targets come from tauri.conf.json (`dmg`, `app`, `nsis`, `appimage`,
# `deb`);
# on each OS the Tauri bundler only produces the targets valid for that
# platform. All three platforms build the same commit in parallel and the
# release job collects every artifact into a single draft Release.
#
# Updater artifacts are generated when TAURI_SIGNING_PRIVATE_KEY is configured.
# Code signing and notarization are tracked separately; macOS Gatekeeper and
# Windows SmartScreen may still warn until those certificates are configured.
name: desktop-build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish artifacts as a draft GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag (e.g. v0.1.0); required when release=true"
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older LTS keeps the glibc floor low for AppImage/deb consumers.
          - os: ubuntu-22.04
          # arm64 (Apple Silicon); add macos-13 if Intel builds are needed.
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Installs the toolchain pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The Tauri crate is a member of the single root cargo workspace, so
      # `tauri build` compiles the binary and writes every bundle into the
      # root `target/` directory (there is no separate src-tauri workspace).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      # System libraries required to compile and bundle Tauri 2 on Ubuntu 22.04.
      # Keep in sync with https://v2.tauri.app/start/prerequisites/#linux when
      # upgrading Tauri.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential
      - run: pnpm install --frozen-lockfile
      # scripts/package-desktop.mjs is the single source of truth for turning
      # the checked-in config (no sidecars, so `tauri dev` resolves rg/deno
      # from PATH) into a packaged build: it enables the downloaded sidecars,
      # turns on updater artifacts when a signing key is present, and applies
      # VERSION_TAG when this run is building a release. It also restores
      # tauri.conf.json/Cargo.toml/package.json/Cargo.lock afterward, which is
      # a no-op for this disposable runner but keeps the same script safe to
      # run on a developer's checkout (see `task package:desktop`).
      - name: Build desktop bundle(s)
        shell: bash
        env:
          DENO_VERSION: v2.9.5
          RG_VERSION: 15.2.0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) && (inputs.tag || github.ref_name) || '' }}
        run: node scripts/package-desktop.mjs ${VERSION_TAG:+--tag "$VERSION_TAG"}
      # Each platform produces only the bundle types valid for its OS
      # (macOS=dmg, Windows=nsis, Linux=appimage+deb). Listing all four
      # globs is safe: upload-artifact combines them into one search and
      # only fails when the combined result is empty, so a per-platform
      # miss on the other types never trips `if-no-files-found: error`.
      - uses: actions/upload-artifact@v6
        with:
          name: ora-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb

  release:
    needs: bundle
    if: inputs.release || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # The manifest generator is checked into the repository and is not part
      # of the downloaded bundle artifacts, so this job needs its own checkout.
      - uses: actions/checkout@v6
      # Manual dispatch with release=true must name the tag explicitly; tag
      # pushes carry it in the ref.
      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: |
          echo "::error::release=true requires the 'tag' input (e.g. v0.1.0)"
          exit 1
      - uses: actions/download-artifact@v7
        with:
          path: bundles
          merge-multiple: true
      - name: Detect updater signing key
        id: updater-signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY//[[:space:]]/}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate static updater manifest
        if: steps.updater-signing.outputs.enabled == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/create-desktop-update-manifest.mjs bundles
      # Draft on purpose: releases get a manual check before publish.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: bundles/**
