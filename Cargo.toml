[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/application",
    "crates/acp",
    "crates/backend",
    "crates/contracts",
    "crates/db",
    "crates/domain",
    "crates/fs",
    "crates/gitlancer",
    "crates/history",
    "crates/logging",
    "crates/plugin-manifest",
    "crates/plugin-lifecycle",
    "crates/plugin-manager",
    "crates/plugin-runtime",
    "crates/process",
    "crates/pty",
    "crates/scheduler",
    "crates/skill-package",
    "crates/utils",
    "xtask",
]
default-members = [
    "crates/application",
    "crates/acp",
    "crates/backend",
    "crates/contracts",
    "crates/db",
    "crates/domain",
    "crates/fs",
    "crates/gitlancer",
    "crates/history",
    "crates/logging",
    "crates/plugin-manifest",
    "crates/plugin-lifecycle",
    "crates/plugin-manager",
    "crates/plugin-runtime",
    "crates/process",
    "crates/pty",
    "crates/scheduler",
    "crates/skill-package",
    "crates/utils",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"

[workspace.dependencies]
# Internal
ora-application = { path = "crates/application" }
ora-acp = { path = "crates/acp" }
ora-backend = { path = "crates/backend" }
ora-contracts = { path = "crates/contracts" }
ora-db = { path = "crates/db" }
ora-domain = { path = "crates/domain" }
ora-fs = { path = "crates/fs" }
gitlancer = { path = "crates/gitlancer" }
ora-history = { path = "crates/history" }
ora-logging = { path = "crates/logging" }
ora-plugin-manifest = { path = "crates/plugin-manifest" }
ora-plugin-lifecycle = { path = "crates/plugin-lifecycle" }
ora-plugin-manager = { path = "crates/plugin-manager" }
ora-plugin-runtime = { path = "crates/plugin-runtime" }
ora-process = { path = "crates/process" }
ora-pty = { path = "crates/pty" }
ora-scheduler = { path = "crates/scheduler" }
ora-skill-package = { path = "crates/skill-package" }
ora-utils = { path = "crates/utils" }

# External
agent-client-protocol-schema = "=1.6.0"
chrono = "0.4"
chrono-tz = "0.10"
cron = "0.12"
derive_more = "2"
futures = "0.3"
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }
libc = "0.2"
log = "0.4"
notify = "8.2"
petgraph = "0.7"
portable-pty = "0.9"
pretty_assertions = "1"
r2d2 = "0.8"
regex = "1"
semver = "1"
rusqlite = "0.37"
serde = "1.0"
similar = "2"
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_with = { version = "3" }
serde_yaml = "0.9"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = "1"
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
ts-rs = "12.0"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-normalization = "0.1"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
zip = { version = "2", features = ["aes-crypto"] }

[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"
