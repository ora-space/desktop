[package]
name = "ora-desktop"
version = "0.1.0"
description = "Ora Desktop"
authors = ["Eric Wang"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Child webviews (`Window::add_child`, `Webview::reparent`) need Tauri's unstable API.
# Off by default: the stable build only offers windowed surfaces and `surface_capabilities`
# reports `embedded: false`.
embedded-surfaces = ["tauri/unstable"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
toml = { workspace = true }

[dependencies]
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
ora-application = { path = "../../../crates/application" }
ora-backend = { path = "../../../crates/backend" }
ora-contracts = { path = "../../../crates/contracts" }
ora-fs = { path = "../../../crates/fs" }
ora-domain = { path = "../../../crates/domain" }
ora-logging = { path = "../../../crates/logging" }
ora-plugin-lifecycle = { path = "../../../crates/plugin-lifecycle" }
ora-plugin-manager = { path = "../../../crates/plugin-manager" }
ora-plugin-manifest = { path = "../../../crates/plugin-manifest" }
ora-runtime-settings = { path = "../../../crates/runtime-settings" }
ora-surface = { path = "../../../crates/surface" }
semver = { workspace = true }
ora-utils = { path = "../../../crates/utils" }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "sync", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
pretty_assertions = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri = { version = "2.11.5", features = ["test"] }
tokio = { version = "1", features = ["rt", "test-util"] }
tracing-subscriber = "0.3"
