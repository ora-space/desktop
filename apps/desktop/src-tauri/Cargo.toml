[package]
name = "ora-desktop"
version = "0.1.0"
description = "Ora Desktop"
authors = ["Eric Wang"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Child webviews (`Window::add_child`, `Webview::reparent`) need Tauri's unstable API.
# Off by default: the stable build only offers windowed surfaces and `surface_capabilities`
# reports `embedded: false`.
embedded-surfaces = ["tauri/unstable"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
toml = { workspace = true }

[dependencies]
chrono = { workspace = true }
chrono-tz = "0.10"
base64 = { workspace = true }
getrandom = "0.3"
iana-time-zone = "0.1"
minisign-verify = "0.2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"
updater-http = { package = "reqwest", version = "0.13.4", default-features = false, features = ["socks"] }
ora-application = { path = "../../../crates/application" }
ora-backend = { path = "../../../crates/backend" }
ora-contracts = { path = "../../../crates/contracts" }
ora-fs = { path = "../../../crates/fs" }
ora-domain = { path = "../../../crates/domain" }
ora-logging = { path = "../../../crates/logging" }
ora-plugin-asset = { path = "../../../crates/plugin-asset" }
ora-plugin-lifecycle = { path = "../../../crates/plugin-lifecycle" }
ora-plugin-manager = { path = "../../../crates/plugin-manager" }
ora-plugin-manifest = { path = "../../../crates/plugin-manifest" }
ora-plugin-protocol = { path = "../../../crates/plugin-protocol" }
ora-process = { path = "../../../crates/process" }
ora-runtime-settings = { path = "../../../crates/runtime-settings" }
ora-scheduler = { path = "../../../crates/scheduler" }
ora-surface = { path = "../../../crates/surface" }
semver = { workspace = true }
ora-utils = { path = "../../../crates/utils", features = ["desktop-proxy", "http-reqwest"] }
reqwest = { workspace = true, features = ["json"] }
sha2 = { workspace = true }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
tauri-plugin-single-instance = "2"

# The Linux Secret Service (pure-Rust D-Bus, so builds need no libdbus). Windows Credential
# Manager is written directly through windows-sys so the entry does not roam. Desktop ships for
# Windows and Linux only.
[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["async-secret-service", "tokio", "crypto-rust"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials", "Win32_System_Console"] }

[dev-dependencies]
ora-fs = { workspace = true, features = ["test-support"] }
pretty_assertions = "1"
rusqlite = { workspace = true, features = ["bundled"] }
tauri = { version = "2.11.5", features = ["test"] }
tokio = { version = "1", features = ["rt", "test-util"] }
tracing-subscriber = "0.3"
