# Permission set granting the `main` webview every application command.
# The `allow-<command>` permissions are autogenerated by tauri-build from
# `app_commands.rs`; this set groups them so `capabilities/default.json` can
# reference one identifier. Remote surface webviews never receive this set.
[[set]]
identifier = "allow-app-commands"
description = "Allows the main webview to invoke every application command"
permissions = [
    "allow-create-project",
    "allow-get-project",
    "allow-list-projects",
    "allow-list-project-branches",
    "allow-update-project",
    "allow-delete-project",
    "allow-create-task",
    "allow-get-task",
    "allow-list-tasks",
    "allow-update-task",
    "allow-delete-task",
    "allow-get-task-workspace",
    "allow-get-task-diff",
    "allow-commit-task-changes",
    "allow-push-task-branch",
    "allow-list-task-diff-comments",
    "allow-create-task-diff-comment",
    "allow-reply-task-diff-comment",
    "allow-set-task-diff-comment-status",
    "allow-list-workspace-directory",
    "allow-read-workspace-file",
    "allow-search-workspace",
    "allow-get-spec-catalog",
    "allow-read-spec",
    "allow-warm-session",
    "allow-set-session-config",
    "allow-attach-session",
    "allow-get-session",
    "allow-list-sessions",
    "allow-respond-to-session-permission",
    "allow-stop-session",
    "allow-switch-session-agent",
    "allow-resume-session-history",
    "allow-delete-session",
    "allow-rename-session",
    "allow-stream-contract",
    "allow-cancel-contract-stream",
    "allow-get-agent-runtime-status",
    "allow-list-agent-models",
    "allow-create-skill",
    "allow-get-skill",
    "allow-list-skills",
    "allow-update-skill",
    "allow-delete-skill",
    "allow-prepare-skill-import",
    "allow-get-skill-import",
    "allow-commit-skill-import",
    "allow-cancel-skill-import",
    "allow-create-agent",
    "allow-get-agent",
    "allow-list-agents",
    "allow-list-installed-plugins",
    "allow-scan-plugins",
    "allow-enable-plugin",
    "allow-disable-plugin",
    "allow-activate-plugin",
    "allow-stop-plugin",
    "allow-uninstall-plugin",
    "allow-update-agent",
    "allow-delete-agent",
    "allow-prepare-agent-import",
    "allow-commit-agent-import",
    "allow-get-git-identity",
    "allow-create-workflow",
    "allow-get-workflow",
    "allow-list-workflows",
    "allow-update-workflow",
    "allow-delete-workflow",
    "allow-get-workflow-draft",
    "allow-update-workflow-draft",
    "allow-publish-workflow",
    "allow-rollback-workflow",
    "allow-activate-workflow",
    "allow-list-workflow-versions",
    "allow-get-workflow-version",
    "allow-delete-workflow-snapshot",
    "allow-get-workflow-snapshot",
    "allow-create-workflow-run",
    "allow-get-workflow-run",
    "allow-list-workflow-runs",
    "allow-list-workflow-runs-by-workflow",
    "allow-list-workflow-node-runs",
    "allow-delete-workflow-run",
    "allow-start-workflow-run",
    "allow-cancel-workflow-run",
    "allow-restart-workflow-run",
    "allow-update-workflow-run-input",
    "allow-get-desktop-config",
    "allow-get-developer-mode",
    "allow-set-developer-mode",
    "allow-get-runtime-log-level",
    "allow-set-runtime-log-level",
    "allow-set-worktree-root",
    "allow-resolve-task-cwd",
    "allow-open-location",
    "allow-write-workflow-export",
    "allow-get-dashboard-url",
    "allow-get-dashboard-compare-url",
    "allow-surface-capabilities",
    "allow-surface-list",
    "allow-surface-open",
    "allow-surface-close",
    "allow-surface-set-bounds",
    "allow-surface-set-visible",
    "allow-surface-popout",
    "allow-surface-dock",
    "allow-surface-reload",
]
