<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>desktop</title>
    <style>
      /*
       * Startup splash: painted from the first HTML frame so the window never shows
       * a blank page while the JS bundle loads. Inline styles keep it rendering even
       * before the Tailwind CSS bundle arrives; React removes it once it mounts.
       */
      #ora-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfdfe;
        transition: opacity 220ms ease-out;
      }

      @media (prefers-color-scheme: dark) {
        #ora-splash {
          background: oklch(0.17 0 0);
        }
      }

      #ora-splash .ora-splash-logo {
        width: 72px;
        height: 72px;
        animation: ora-splash-pulse 1.6s ease-in-out infinite;
      }

      #ora-splash.ora-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes ora-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.95;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="ora-splash">
      <!-- Inlined so the logo paints with the first HTML frame, before any asset
           request resolves — the splash never shows as a blank panel. -->
