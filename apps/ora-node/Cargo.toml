[package]
name = "ora-node"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
gitlancer.workspace = true
ora-utils = { workspace = true, features = ["local-ipc"] }
ora-logging.workspace = true
ora-node-db = { workspace = true }
ora-node-protocol = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shlex.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ora-process-client.workspace = true
ora-process-protocol.workspace = true
ora-node-transport = { workspace = true, features = ["websocket"] }
tokio = { workspace = true, features = ["rt", "net", "time", "signal", "macros", "sync"] }
libc.workspace = true

[dev-dependencies]
ora-controller.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
rustls.workspace = true
rcgen.workspace = true
tracing-subscriber.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ora-contracts.workspace = true
reqwest = { workspace = true, features = ["json"] }
