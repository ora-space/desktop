[package]
name = "ora-controller"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
ora-node-protocol.workspace = true
ora-utils.workspace = true
ora-logging.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "signal", "macros", "sync"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ora-contracts.workspace = true
ora-controller-proto.workspace = true
ora-node-transport = { workspace = true, features = ["websocket"] }
ora-utils = { workspace = true, features = ["local-ipc"] }
libc.workspace = true
clap.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
ora-node-transport = { workspace = true, features = ["websocket"] }
reqwest = { workspace = true, features = ["json"] }
# The test-only server stubs host an in-memory Cloud over the real contract.
ora-controller-proto = { workspace = true, features = ["test-server"] }
futures.workspace = true
